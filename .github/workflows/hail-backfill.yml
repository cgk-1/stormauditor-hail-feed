name: hail-backfill

# Timeout-proof: saves progress after EVERY date, stops itself at ~100 minutes
# (limit 115). Runs every 3 hours (offset from wind-backfill) until the 3-year
# window is complete, then exits in seconds each run. Disable this workflow in
# the Actions tab once the log says "Hail backfill COMPLETE".

on:
  schedule:
    - cron: "15 1-23/3 * * *"
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: "Minutes of work per run (default 100)."
        required: false

concurrency:
  group: hail-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Python deps
        run: pip install pygrib numpy rasterio shapely requests
      - name: Walk dates until budget
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INGEST_SECRET:     ${{ secrets.INGEST_SECRET }}
          TIME_BUDGET_MIN:   ${{ github.event.inputs.time_budget_min }}
        run: python backfill_walker.py
