name: hail-ingest-newdb

on:
  schedule:
    - cron: "0 9 * * *"
    # Second daily pass (2026-08-27): self-heal sweep — re-runs any of the
    # last 3 days that ingested zero states (late MESH archive files or a
    # skipped/failed morning run, e.g. the 2026-08-26 nationwide miss).
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Local date(s): YYYY-MM-DD, YYYYMMDD, START..END or a:b, comma lists. Blank = yesterday (+ self-heal)."
        required: false
      states:
        description: "Comma list of states. Blank = all permitted."
        required: false
      dry_run:
        description: "1 = compute everything, write nothing (payload md5 + row counts in the summary/artifact)."
        required: false
      day_convention:
        description: "Day convention. Empty = v4 (own-zone local days; nightly default since Stage 4, owner-approved 2026-10-07). v3 = old state-zone days (rollback/override only)."
        required: false
      clear_step:
        description: "Explicit-date runs only: 1 (default) = after a fully successful day, clear stale rows of states not re-supplied (hz_day_clear_states_v2). 0 = off."
        required: false

# One run at a time; a second trigger queues behind the first (never cancels it).
concurrency: {group: hail-ingest, cancel-in-progress: false}
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Run ingester
        env:
          SUPABASE_URL:      https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET:     ${{ secrets.INGEST_SECRET_NEW }}
          INGEST_DATE:       ${{ github.event.inputs.date }}
          STATES:            ${{ github.event.inputs.states }}
          DRY_RUN:           ${{ github.event.inputs.dry_run }}
          DAY_CONVENTION:    ${{ github.event.inputs.day_convention || 'v4' }}
          CLEAR_STEP:        ${{ github.event.inputs.clear_step }}
          FEED_OUT_DIR:      feed-out
        run: python mesh_ingest.py
      - name: Upload run record (summary JSON, quarantine records, dry-run payloads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-out-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: feed-out
          if-no-files-found: ignore
          retention-days: 30
