name: hail-ingest

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Back-date to ingest (YYYYMMDD). Blank = yesterday."
        required: false
      states:
        description: "Comma list of states. Blank = all permitted."
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Python deps
        run: pip install pygrib numpy rasterio shapely requests
      - name: Run ingester
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INGEST_SECRET:     ${{ secrets.INGEST_SECRET }}
          INGEST_DATE:       ${{ github.event.inputs.date }}
          STATES:            ${{ github.event.inputs.states }}
        run: python mesh_ingest.py
