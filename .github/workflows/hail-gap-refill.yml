name: hail-gap-refill
# Rebuild of corrupted hail days (wind-data-as-hail on 2024-07-16 + radar
# artifact days). Re-ingests from the NOAA MRMS archive with the new 8-inch
# artifact ceiling active. Previously: one-time refill of dates missing in the old
# and new databases (the original feed skipped them - transient MRMS download
# failures). Splits the list into 6 parallel chunks. Safe to re-run: the
# ingester deletes+rewrites each (state, day) it processes.
on:
  workflow_dispatch: {}

jobs:
  refill:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Run ingester (chunk ${{ matrix.chunk }})
        env:
          SUPABASE_URL:      https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET:     ${{ secrets.INGEST_SECRET_NEW }}
          ALL_DATES:         "20230818,20230910,20230913,20231013,20231104,20231108,20231123,20231210,20240104,20240214,20240215,20240216,20240304,20240305,20240307,20240310,20240430,20240525,20240604,20240625,20240709,20240716,20240822,20240906,20240914,20240916,20240919,20240921,20241014,20241117,20241225,20241226,20241227,20241229,20241230,20241231,20250101,20250102,20250105,20250125,20250126,20250127,20250128,20250130,20250131,20250210,20250313,20250405,20250415,20250427,20250508,20250611,20250625,20250710,20250728,20250729,20250815,20250903,20250910,20250929,20251104,20251210,20251221,20251227,20251230,20260102,20260105,20260114,20260121,20260211,20260316,20260317,20260428,20260430,20260723,20260725,20260726"
          CHUNK:             ${{ matrix.chunk }}
        run: |
          export INGEST_DATE=$(python -c "import os; d=os.environ['ALL_DATES'].split(','); c=int(os.environ['CHUNK']); print(','.join(d[c::6]))")
          echo "Chunk $CHUNK: $INGEST_DATE"
          python mesh_ingest.py
