name: hail-gap-refill
# One-time refill of 181 dates whose MESH points were missing in BOTH the old
# and new databases (the original feed skipped them - transient MRMS download
# failures). Splits the list into 6 parallel chunks. Safe to re-run: the
# ingester deletes+rewrites each (state, day) it processes.
on:
  workflow_dispatch: {}

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Python deps
        run: pip install pygrib numpy rasterio shapely requests
      - name: Run ingester (chunk ${{ matrix.chunk }})
        env:
          SUPABASE_URL:      https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET:     ${{ secrets.INGEST_SECRET_NEW }}
          ALL_DATES:         "20250627,20250629,20250630,20250702,20250704,20250705,20250706,20250708,20250709,20250710,20250712,20250713,20250714,20250715,20250716,20250717,20250721,20250722,20250723,20250724,20250727,20250728,20250729,20250731,20250801,20250802,20250803,20250805,20250806,20250807,20250808,20250809,20250810,20250811,20250812,20250813,20250814,20250815,20250817,20250818,20250820,20250821,20250823,20250824,20250826,20250827,20250828,20250830,20250831,20250906,20250907,20250908,20250909,20250910,20250911,20250912,20250913,20250915,20250920,20250923,20250925,20250926,20251001,20251002,20251003,20251005,20251006,20251008,20251009,20251010,20251011,20251012,20251016,20251019,20251020,20251026,20251027,20251029,20251109,20251110,20251111,20251202,20251205,20251208,20251215,20251219,20251229,20260103,20260115,20260118,20260125,20260126,20260131,20260201,20260205,20260206,20260207,20260208,20260210,20260211,20260213,20260214,20260215,20260216,20260217,20260222,20260223,20260224,20260227,20260301,20260302,20260304,20260305,20260307,20260308,20260309,20260312,20260315,20260316,20260318,20260322,20260324,20260326,20260328,20260401,20260402,20260403,20260405,20260412,20260413,20260418,20260421,20260424,20260427,20260428,20260502,20260507,20260509,20260510,20260511,20260514,20260516,20260517,20260518,20260521,20260523,20260524,20260525,20260526,20260527,20260528,20260529,20260530,20260531,20260601,20260602,20260603,20260610,20260613,20260614,20260615,20260616,20260617,20260618,20260619,20260620,20260621,20260622,20260623,20260625,20260626,20260627,20260628,20260629,20260630,20260701,20260703,20260704,20260705,20260706,20260707"
