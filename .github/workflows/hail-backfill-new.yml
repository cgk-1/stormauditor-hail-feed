name: hail-backfill-newdb

# Timeout-proof: saves progress after EVERY date, stops itself at ~100 minutes
# (limit 115). Runs every 3 hours (offset from wind-backfill) until the 3-year
# window is complete, then exits in seconds each run. Disable this workflow in
# the Actions tab once the log says "Hail backfill COMPLETE".

on:
  schedule:
    - cron: "45 1-23/3 * * *"
  workflow_dispatch:
    inputs:
      time_budget_min:
        description: "Minutes of work per run (default 100)."
        required: false

concurrency:
  group: newdb-hail-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Walk dates until budget
        env:
          SUPABASE_URL:      https://aozjsfjemobuzqrhxcxy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvempzZmplbW9idXpxcmh4Y3h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzMyODIsImV4cCI6MjEwMDI0OTI4Mn0.gYwwzMcT4VCuTyWHNXlm8viyeGOsv7isfNgegYAmcV8
          INGEST_SECRET:     ${{ secrets.INGEST_SECRET_NEW }}
          TIME_BUDGET_MIN:   ${{ github.event.inputs.time_budget_min }}
        run: python backfill_walker.py
